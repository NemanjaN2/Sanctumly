    <!-- Loading splash: avoids a blank white flash before React mounts -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; background: #07070b; }
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(139,139,245,0.16), transparent 60%),
          #07070b;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #initial-splash.hide { opacity: 0; pointer-events: none; }
      #initial-splash img {
        width: 72px; height: 72px; border-radius: 18px;
        box-shadow: 0 0 40px rgba(139,139,245,0.4);
      }
      #initial-splash .spinner {
        width: 26px; height: 26px;
        border: 2.5px solid rgba(255,255,255,0.12);
        border-top-color: #8b8bf5;
        border-radius: 50%;
        animation: splashspin 0.7s linear infinite;
      }
      @keyframes splashspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash shown until React mounts and removes it -->
    <div id="initial-splash">
      <img src="/logo.png" alt="Sanctumly" />
      <div class="spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Service Worker registered'))
            .catch(err => console.log('❌ SW registration failed:', err));
        });
      }

      // Android PWA Install Prompt — store globally so a React button can trigger it
      window.deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
        console.log('✅ PWA install prompt available');
      });

      window.addEventListener('appinstalled', () => {
        console.log('✅ PWA was installed');
        window.deferredPrompt = null;
        if (window.gtag) gtag('event', 'pwa_install');
      });
    </script>
  </body>
